name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Validate Docker Compose config
        env:
          PRESENTONIKA_BRIDGE_TOKEN: ci-only-bridge-token
          BRIDGE_SAVE_TOKEN_VALIDATE_BEARER: ci-only-validation-token
          CONVERTER_IMAGE: presentonika/pptx-importer:ci
        run: docker compose config --quiet
      - name: Build production image
        run: docker build .
